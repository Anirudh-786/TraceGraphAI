spring.application.name=backend
server.port=${PORT:8080}

# FalkorDB connection settings (local docker or remote cloud)
falkordb.host=${FALKORDB_HOST:localhost}
falkordb.port=${FALKORDB_PORT:6379}
falkordb.graph=${FALKORDB_GRAPH:tracegraph}
falkordb.username=${FALKORDB_USERNAME:}
falkordb.password=${FALKORDB_PASSWORD:}
falkordb.url=${FALKORDB_URL:}

# CORS settings for local development and deployed Vercel frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# AI Inference settings (local Ollama or remote OpenAI-compatible endpoint)
ai.inference.url=${AI_INFERENCE_URL:http://localhost:11434}
ai.inference.model=${AI_INFERENCE_MODEL:llama3.2:3b}
ai.inference.api-key=${AI_INFERENCE_API_KEY:}
ai.inference.timeout-seconds=${AI_INFERENCE_TIMEOUT:30}

# Demo graph auto-seed (false by default to prevent unwanted mutations)
graph.seed.on-startup=${GRAPH_SEED_ON_STARTUP:false}